project_id = "contour-test"

[api]
enabled = false
port = 55321

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55324
smtp_port = 55325
admin_email = "noreply@contour.local"
sender_name = "Contour"

[auth]
enabled = true
site_url = "http://localhost:3000"
minimum_password_length = 8
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback?next=/settings/security",
  "http://127.0.0.1:3000/auth/callback?next=/settings/security",
]

[auth.email]
enabled = true
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email.template.confirmation]
subject = "Verify your email · Contour"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "Join Contour"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your password · Contour"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your login link · Contour"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your email · Contour"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Verify it's you · Contour"
content_path = "./supabase/templates/reauthentication.html"

[edge_runtime]
enabled = false

[analytics]
enabled = false
