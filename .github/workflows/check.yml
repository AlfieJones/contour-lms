name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Types
            command: pnpm check-types
          - name: Lint
            # Type-aware linting needs the workspace packages built first.
            command: pnpm exec turbo run lint
          - name: Tests
            command: pnpm test
          - name: Formatting
            command: pnpm format
          - name: Build
            command: pnpm build
          - name: Package boundaries
            command: pnpm check:boundaries
    env:
      HUSKY: "0"
      # Validation-only values: these checks do not connect to a database.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  e2e:
    name: Browser and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lms/web exec playwright install --with-deps chromium
      - run: pnpm supabase:start
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
